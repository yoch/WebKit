name: JSC InadequateCoverage Research

on:
  push:
    branches:
      - research/jsc-inadequate-coverage

jobs:
  jsc-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !LayoutTests/
            !JSTests/

      - name: Install JSCOnly build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build libicu-dev bison flex gperf ruby python3

      - name: Configure JSCOnly Release
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B WebKitBuild/JSCOnly/Release -GNinja \
            -DPORT=JSCOnly \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_API_TESTS=OFF

      - name: Build jsc
        run: cmake --build WebKitBuild/JSCOnly/Release --target jsc -- -j2

      - name: Record exact build revision
        run: |
          git rev-parse HEAD
          WebKitBuild/JSCOnly/Release/bin/jsc --version || true

      - name: Run standalone phase-change diagnostic
        shell: bash
        run: |
          cat > /tmp/inadequate-coverage-repro.js <<'EOF'
          var INSERTS = 20000;
          var UPDATES = 200000;

          function makeScorer() {
              var state = { sink: 0 };
              function scorePostingDoc(results, docId, termFreq) {
                  var fieldLength = 1 + (docId & 7);
                  var rawScore = termFreq * 2.2 / (termFreq + 1.2 * (0.3 + 0.7 * fieldLength));
                  var weightedScore = 1.7 * rawScore;
                  var result = results.get(docId);
                  if (result) {
                      result.score += weightedScore;
                      state.sink ^= result.score | 0;
                  } else
                      results.set(docId, { score: weightedScore });
              }
              scorePostingDoc.state = state;
              return scorePostingDoc;
          }

          var scorePostingDoc = makeScorer();
          var results = new Map();
          for (var i = 0; i < INSERTS; ++i)
              scorePostingDoc(results, i, 1 + (i & 3));
          var start = preciseTime();
          for (var i = 0; i < UPDATES; ++i)
              scorePostingDoc(results, i % INSERTS, 1 + (i & 3));
          var elapsedMs = (preciseTime() - start) * 1000;
          if (results.size !== INSERTS)
              throw new Error("unexpected result size: " + results.size);
          print("REPRO elapsed_ms=" + elapsedMs.toFixed(6) + " sink=" + scorePostingDoc.state.sink + " size=" + results.size);
          EOF

          JSC=WebKitBuild/JSCOnly/Release/bin/jsc
          COMMON=(--useFTLJIT=false --useConcurrentJIT=false --printEachOSRExit=true --verboseDFGOSRExit=true --logCompilationChanges=true)
          for threshold in 100 20 10 5 1 1000; do
              echo "=== threshold=$threshold ==="
              "$JSC" "${COMMON[@]}" --osrExitCountForReoptimization="$threshold" /tmp/inadequate-coverage-repro.js 2>&1 | tee "/tmp/jsc-$threshold.log"
              echo "InadequateCoverage count: $(grep -c 'InadequateCoverage' "/tmp/jsc-$threshold.log" || true)"
          done
